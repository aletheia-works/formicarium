<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>formicarium runner</title>
  <style>
    :root { color-scheme: light dark; --bg: #fafafa; --fg: #1d1d1f; --muted: #6b6b70; --ok: #1a7f37; --ng: #cf222e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161618; --fg: #e8e8ea; --muted: #9a9aa0; --ok: #3fb950; --ng: #f85149; } }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0 0 12px; }
    dt { color: var(--muted); }
    dd { margin: 0; font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
    pre { margin: 0; padding: 12px; border-radius: 6px; background: rgba(127,127,127,.12); white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.45 ui-monospace, monospace; }
    .ok { color: var(--ok); } .ng { color: var(--ng); }
  </style>
</head>
<body>
  <h1>formicarium runner</h1>
  <dl>
    <dt>crossOriginIsolated</dt><dd id="isolated" data-testid="isolated">…</dd>
    <dt>guest</dt><dd id="guest" data-testid="guest">…</dd>
    <dt>status</dt><dd id="status" data-testid="status">starting</dd>
    <dt>elapsed</dt><dd id="elapsed" data-testid="elapsed">-</dd>
  </dl>
  <pre id="output" data-testid="output"></pre>
  <script type="module" src="./app.js"></script>
</body>
</html>
