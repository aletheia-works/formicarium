name: Maintenance
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
jobs:
  prepare:
    if: ${{ vars.MAINTENANCE_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      pr: ${{ steps.prepare.outputs.pr }}
      head: ${{ steps.prepare.outputs.head }}
      operation: ${{ steps.prepare.outputs.operation }}
      base: ${{ steps.prepare.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Install trusted base tools only
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0, node24
        id: read-token
        with:
          client-id: ${{ secrets.MAINTENANCE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAINTENANCE_READ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-actions: read
          permission-checks: read
          permission-pull-requests: read
          permission-administration: read
          skip-token-revoke: false
      - name: Independently inspect and reproduce PR data
        id: prepare
        env:
          MAINTENANCE_TOKEN: ${{ steps.read-token.outputs.token }}
          TRUSTED_BASE_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          BUN_EXECUTABLE="$(command -v bun)" BIOME_EXECUTABLE="$GITHUB_WORKSPACE/node_modules/@biomejs/biome/bin/biome" node .github/maintenance/runner.mjs prepare .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintenance-${{ steps.prepare.outputs.head }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: prepared.json
          retention-days: 7
          if-no-files-found: error
  format-write:
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.operation == 'format-push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: maintenance-${{ github.repository }}-${{ needs.prepare.outputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0, node24
        id: token
        with:
          client-id: ${{ secrets.FORMAT_APP_CLIENT_ID }}
          private-key: ${{ secrets.FORMAT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-actions: read
          permission-checks: read
          permission-pull-requests: read
          skip-token-revoke: false
      - name: Recheck and atomically commit trusted additions
        env:
          MAINTENANCE_TOKEN: ${{ steps.token.outputs.token }}
          TRUSTED_BASE_SHA: ${{ needs.prepare.outputs.base }}
          PREPARED_HEAD: ${{ needs.prepare.outputs.head }}
          PREPARATION_RUN_ID: ${{ github.run_id }}
          PREPARATION_ATTEMPT: ${{ github.run_attempt }}
        run: node .github/maintenance/runner.mjs format-write .
  dependency-merge:
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.operation == 'dependency-merge' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: maintenance-${{ github.repository }}-${{ needs.prepare.outputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0, node24
        id: token
        with:
          client-id: ${{ secrets.MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-actions: read
          permission-checks: read
          permission-pull-requests: read
          permission-administration: read
          skip-token-revoke: false
      - name: Recheck and sha-conditional squash merge
        env:
          MAINTENANCE_TOKEN: ${{ steps.token.outputs.token }}
          TRUSTED_BASE_SHA: ${{ needs.prepare.outputs.base }}
          PREPARED_HEAD: ${{ needs.prepare.outputs.head }}
          PREPARATION_RUN_ID: ${{ github.run_id }}
          PREPARATION_ATTEMPT: ${{ github.run_attempt }}
        run: node .github/maintenance/runner.mjs dependency-merge .
  record:
    if: always()
    needs: [prepare, format-write, dependency-merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Record bounded workflow outcomes
        env:
          OUTCOMES: ${{ toJSON(needs) }}
        run: |
          node -e 'const n=JSON.parse(process.env.OUTCOMES); process.stdout.write(JSON.stringify(Object.fromEntries(Object.entries(n).map(([k,v])=>[k,v.result])))+"\n")'

