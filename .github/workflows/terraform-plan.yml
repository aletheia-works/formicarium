name: Terraform Plan

on:
  pull_request_target:
    paths:
      - 'infra/github/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  plan:
    if: github.repository == 'aletheia-works/formicarium' && github.event.pull_request.head.repo.full_name == github.repository
    uses: aletheia-works/.github/.github/workflows/terraform-plan.yml@2d85c4ddca01b35127a16915f0000bc54fdc85a6 # v1.4.0
    with:
      working_directory: infra/github
    secrets: inherit
