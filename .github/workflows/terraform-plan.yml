name: Terraform Plan

on:
  pull_request_target:
    paths:
      - 'infra/github/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  plan:
    if: github.repository == 'aletheia-works/formicarium' && github.event.pull_request.head.repo.full_name == github.repository
    uses: aletheia-works/.github/.github/workflows/terraform-plan.yml@b24ce77ad773bcca239d8140aeb373f295572521 # v1.3.1
    with:
      working_directory: infra/github
    secrets: inherit
