name: Terraform Plan

on:
  pull_request_target:
    paths:
      - 'infra/github/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  plan:
    if: github.repository == 'aletheia-works/formicarium' && github.event.pull_request.head.repo.full_name == github.repository
    uses: aletheia-works/.github/.github/workflows/terraform-plan.yml@f1e71b990c2fd7086e78931ba8609b96ac68104b # v1.4.1
    with:
      working_directory: infra/github
    secrets: inherit
