name: Terraform Plan

on:
  pull_request_target:
    paths:
      - 'infra/github/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  plan:
    if: github.repository == 'aletheia-works/formicarium' && github.event.pull_request.head.repo.full_name == github.repository
    uses: aletheia-works/.github/.github/workflows/terraform-plan.yml@f5bb52fe38d6ddf151662ed6b64c0b23eeb50ec4 # v1.3.3
    with:
      working_directory: infra/github
    secrets: inherit
