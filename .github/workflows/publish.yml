{
  "name": "Approved package publication",
  "on": {
    "push": {
      "tags": [
        "v*"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "publication-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "verify": {
      "if": "github.event_name == 'push' && github.repository == 'aletheia-works/formicarium' && startsWith(github.ref, 'refs/tags/v')",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "permissions": {
        "contents": "read",
        "actions": "read",
        "checks": "read"
      },
      "env": {
        "GH_TOKEN": "${{ github.token }}",
        "FORMICARIUM_RELEASE_INPUT_URL": "${{ vars.FORMICARIUM_RELEASE_INPUT_URL }}",
        "FORMICARIUM_RELEASE_INPUT_SHA256": "${{ vars.FORMICARIUM_RELEASE_INPUT_SHA256 }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24.21.0",
            "package-manager-cache": false
          }
        },
        {
          "uses": "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6",
          "with": {
            "bun-version": "1.4.2"
          }
        },
        {
          "run": "bun install --frozen-lockfile --ignore-scripts"
        },
        {
          "run": "bun run build"
        },
        {
          "run": "node scripts/release/bundle.js verify \"$(command -v bun)\" \"$PWD/node_modules/@biomejs/biome/bin/biome\""
        },
        {
          "run": "node .github/publication/runner.mjs fetch .artifacts/publication"
        },
        {
          "run": "node .github/publication/runner.mjs gate .artifacts/publication"
        },
        {
          "run": "node .github/publication/runner.mjs prepare-assets .artifacts/publication .artifacts/publication-assets"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "publication-assets",
            "path": ".artifacts/publication-assets/*",
            "if-no-files-found": "error",
            "retention-days": 1,
            "include-hidden-files": false
          }
        }
      ]
    },
    "publish": {
      "if": "github.event_name == 'push' && github.repository == 'aletheia-works/formicarium' && startsWith(github.ref, 'refs/tags/v')",
      "needs": "verify",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "environment": "release",
      "permissions": {
        "contents": "read",
        "actions": "read",
        "checks": "read",
        "id-token": "write"
      },
      "env": {
        "GH_TOKEN": "${{ github.token }}",
        "FORMICARIUM_RELEASE_INPUT_URL": "${{ vars.FORMICARIUM_RELEASE_INPUT_URL }}",
        "FORMICARIUM_RELEASE_INPUT_SHA256": "${{ vars.FORMICARIUM_RELEASE_INPUT_SHA256 }}",
        "AIDLC_RELEASE_OPERATION": "publish"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24.21.0",
            "package-manager-cache": false
          }
        },
        {
          "run": "node .github/publication/bootstrap.mjs publish"
        }
      ]
    },
    "release": {
      "if": "github.event_name == 'push' && github.repository == 'aletheia-works/formicarium' && startsWith(github.ref, 'refs/tags/v')",
      "needs": "publish",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "environment": "release",
      "permissions": {
        "contents": "write",
        "actions": "read",
        "checks": "read"
      },
      "env": {
        "GH_TOKEN": "${{ github.token }}",
        "FORMICARIUM_RELEASE_INPUT_URL": "${{ vars.FORMICARIUM_RELEASE_INPUT_URL }}",
        "FORMICARIUM_RELEASE_INPUT_SHA256": "${{ vars.FORMICARIUM_RELEASE_INPUT_SHA256 }}",
        "AIDLC_RELEASE_OPERATION": "release"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24.21.0",
            "package-manager-cache": false
          }
        },
        {
          "run": "node .github/publication/bootstrap.mjs release"
        }
      ]
    }
  }
}
