name: Publish package

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Require a merged release PR with successful CI
    if: github.event_name == 'push' && github.repository == 'aletheia-works/formicarium' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.sha }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout the immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require matching stable package version and merged Bot PR
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(jq -r .version package.json)" = "${RELEASE_TAG#v}"
          gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/pulls" > "$RUNNER_TEMP/release-prs.json"
          jq --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" '[.[] | select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == "main" and .base.repo.full_name == $repo and .head.repo.full_name == $repo and .head.ref == "release-please--branches--main--components--formicarium" and .user.login == "aletheia-works-bot[bot]")] | if length == 1 then .[0] else error("exactly one merged Bot release PR required") end' "$RUNNER_TEMP/release-prs.json" > "$RUNNER_TEMP/release-pr.json"
          head=$(jq -r .head.sha "$RUNNER_TEMP/release-pr.json")
          workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml" --jq .id)
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&per_page=100" > "$RUNNER_TEMP/release-ci.json"
          jq -e --arg sha "$head" --argjson workflow "$workflow" '[.workflow_runs[] | select(.head_sha == $sha and .workflow_id == $workflow and .event == "pull_request")] | sort_by(.run_number, .run_attempt) | last | .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/release-ci.json"
          printf 'Merged release PR #%s, successful PR CI, tag %s, source %s\n' "$(jq -r .number "$RUNNER_TEMP/release-pr.json")" "$RELEASE_TAG" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: authorize
    uses: ./.github/workflows/ci.yml
    # ci.yml's changes job reads the pull request; a called workflow may not
    # request more than this, or the run fails to start.
    permissions:
      contents: read
      actions: read
      pull-requests: read

  publish:
    needs: verify
    if: github.event_name == 'push' && github.repository == 'aletheia-works/formicarium' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_SHA256: ${{ needs.verify.outputs.candidate-sha256 }}
      DIST_TAG: ${{ needs.verify.outputs.candidate-dist-tag }}
      VERSION: ${{ needs.verify.outputs.candidate-version }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: latest
          check-latest: true
          package-manager-cache: false
      - name: Download this run's verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.verify.outputs.candidate-artifact }}
          path: .artifacts/downloaded-candidate
      - name: Select the verified tarball
        id: select-package
        run: |
          mkdir -p .artifacts/publication-package
          cp .artifacts/downloaded-candidate/release-candidate/candidate.tgz .artifacts/publication-package/candidate.tgz
      - name: Verify package digest
        id: digest
        working-directory: .artifacts/publication-package
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  candidate.tgz\n' "$EXPECTED_SHA256" | sha256sum --check --strict
      - name: Refuse conflicting existing npm versions; resume an identical publication
        id: registry
        run: |
          bun - <<'JS'
          import { appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const version = process.env.VERSION;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) throw Error('stable version required');
          const response = await fetch(`https://registry.npmjs.org/@aletheia-works%2fformicarium/${version}`, {signal: AbortSignal.timeout(30000)});
          let skip = false;
          if (response.status !== 404) {
            if (!response.ok) throw Error(`registry lookup failed: ${response.status}`);
            const metadata = await response.json();
            const url = new URL(metadata.dist.tarball);
            if (metadata.name !== '@aletheia-works/formicarium' || metadata.version !== version || url.origin !== 'https://registry.npmjs.org' || url.username || url.password) throw Error('registry identity differs');
            const published = await fetch(url, {redirect:'error', signal: AbortSignal.timeout(30000)});
            if (!published.ok) throw Error('existing package download failed');
            const digest = createHash('sha256').update(Buffer.from(await published.arrayBuffer())).digest('hex');
            if (digest !== process.env.EXPECTED_SHA256) throw Error('existing npm version has different bytes; never overwrite');
            skip = true;
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `skip=${skip}\n`);
          JS
      - name: Publish the verified tarball with npm OIDC
        if: steps.registry.outputs.skip == 'false'
        working-directory: .artifacts/publication-package
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIST_TAG" == next || "$DIST_TAG" == latest ]]
          bunx npm@latest publish ./candidate.tgz --provenance --access public --registry https://registry.npmjs.org/ --tag "$DIST_TAG" --ignore-scripts

  release:
    needs: [verify, publish]
    if: github.event_name == 'push' && github.repository == 'aletheia-works/formicarium' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA256: ${{ needs.verify.outputs.candidate-sha256 }}
      RELEASE_TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.verify.outputs.candidate-version }}
      DIST_TAG: ${{ needs.verify.outputs.candidate-dist-tag }}
    steps:
      - name: Download this run's verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.verify.outputs.candidate-artifact }}
          path: .artifacts/downloaded-candidate
      - name: Select the verified tarball
        id: select-package
        run: |
          mkdir -p .artifacts/publication-package
          cp .artifacts/downloaded-candidate/release-candidate/candidate.tgz .artifacts/publication-package/candidate.tgz
      - name: Verify package digest
        id: digest
        working-directory: .artifacts/publication-package
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  candidate.tgz\n' "$EXPECTED_SHA256" | sha256sum --check --strict
      - name: Create the approved GitHub release
        working-directory: .artifacts/publication-package
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./candidate.tgz --repo "$GITHUB_REPOSITORY"
          else
            flags=(--verify-tag)
            if [[ "$DIST_TAG" == next ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" ./candidate.tgz --repo "$GITHUB_REPOSITORY" --title "formicarium $VERSION" --notes "Reviewed package SHA256: $EXPECTED_SHA256" "${flags[@]}"
          fi
