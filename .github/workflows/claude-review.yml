name: Claude Review

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    uses: aletheia-works/.github/.github/workflows/claude-review.yml@f1e71b990c2fd7086e78931ba8609b96ac68104b # v1.4.1
    with:
      rules: >-
        AGENTS.md, the Development section in showcase/site/src/content/docs/development/, and the README.md nearest the changed code
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
