name: Test polyglot lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-lint-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Polyglot lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun actionlint shellcheck ripgrep
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun add --dev --no-save --ignore-scripts @biomejs/biome@latest
      - name: Run polyglot lint
        run: mise run lint:all
