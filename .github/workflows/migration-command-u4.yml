name: U4 provisional command and B1 integration verification
on:
  push:
    branches: [codex/terrarium-migration-b1]
permissions:
  contents: read
concurrency:
  group: migration-command-u4-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Marukome0743/formicarium' && github.ref == 'refs/heads/codex/terrarium-migration-b1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Bind observed absolute Bun executable
        shell: bash
        run: |
          bun_executable="$(command -v bun)"
          [[ "$bun_executable" = /* && -x "$bun_executable" ]]
          [[ "$("$bun_executable" --version)" = '1.4.3' ]]
          [[ "$(node --version)" = 'v26.12.0' ]]
          printf 'BUN_EXECUTABLE=%s\nFORMICARIUM_CI_BUN=%s\n' "$bun_executable" "$bun_executable" >> "$GITHUB_ENV"
          printf 'Observed Bun executable: %s\n' "$bun_executable"
      - run: node scripts/ci/tasks.ts install-frozen --cacheless
      - run: node scripts/ci/tasks.ts build
      - run: node scripts/ci/tasks.ts typecheck
      - name: Restore verified actual distribution before any required test process
        shell: bash
        run: |
          node scripts/migration-command/ci-inputs.js restore ci/migration-command/inputs.bundle.json
          printf 'U2_ACTUAL_SITE=%s/.artifacts/migration-install/actual-site\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - run: node --test --test-concurrency=1 tests/migration-session/ci.test.js tests/migration-install/acceptance.test.js tests/migration-command/acceptance.test.js
      - name: Restore fixed core objects from unchanged accepted local object bundle
        run: node scripts/migration-session/ci-core.js ci/migration-session/inputs.bundle.json
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      - name: Prepare current U4 inputs and independent consumer
        run: node scripts/migration-command/ci.js prepare ci/migration-command/inputs.bundle.json "$RUNNER_TEMP/formicarium-u4-consumer-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" .artifacts/migration-command/ci-context.json
      - name: Create job-only localhost CA, signed leaf certificate and explicit trust
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          tls="$GITHUB_WORKSPACE/.artifacts/migration-command/tls"
          profile="$tls/firefox-profile"
          mkdir -p "$tls" "$HOME/.pki/nssdb"
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 -subj '/CN=formicarium-u4-job-ca' -addext 'basicConstraints=critical,CA:TRUE,pathlen:0' -addext 'keyUsage=critical,keyCertSign' -addext 'nameConstraints=critical,permitted;DNS:localhost' -keyout "$tls/ca-key.pem" -out "$tls/ca-cert.pem"
          chmod 600 "$tls/ca-key.pem"
          printf '%s\n' 'subjectAltName=DNS:localhost' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' > "$tls/leaf.ext"
          openssl req -new -newkey rsa:2048 -nodes -sha256 -subj '/CN=localhost' -keyout "$tls/localhost-key.pem" -out "$tls/localhost.csr"
          chmod 600 "$tls/localhost-key.pem"
          openssl x509 -req -sha256 -days 1 -in "$tls/localhost.csr" -CA "$tls/ca-cert.pem" -CAkey "$tls/ca-key.pem" -CAcreateserial -extfile "$tls/leaf.ext" -out "$tls/localhost-cert.pem"
          rm -- "$tls/ca-key.pem"
          [[ ! -e "$tls/ca-key.pem" ]]
          openssl verify -CAfile "$tls/ca-cert.pem" "$tls/localhost-cert.pem"
          sudo install -m 644 "$tls/ca-cert.pem" /usr/local/share/ca-certificates/formicarium-u4-job-ca.crt
          sudo update-ca-certificates
          certutil -N --empty-password -d "sql:$HOME/.pki/nssdb"
          certutil -A -d "sql:$HOME/.pki/nssdb" -n formicarium-u4-job-ca -t 'C,,' -i "$tls/ca-cert.pem"
          mkdir "$profile"
          certutil -N --empty-password -d "sql:$profile"
          certutil -A -d "sql:$profile" -n formicarium-u4-job-ca -t 'C,,' -i "$tls/ca-cert.pem"
          [[ -f "$profile/cert9.db" && ! -L "$profile/cert9.db" ]]
          tls_sha="$(openssl x509 -in "$tls/localhost-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')"
          [[ "$tls_sha" =~ ^[a-f0-9]{64}$ ]]
          printf 'FORMICARIUM_INSTALL_TLS_CERT=%s\nFORMICARIUM_INSTALL_TLS_KEY=%s\nFORMICARIUM_INSTALL_TLS_SHA256=%s\nFORMICARIUM_INSTALL_FIREFOX_PROFILE=%s\n' "$tls/localhost-cert.pem" "$tls/localhost-key.pem" "$tls_sha" "$profile" >> "$GITHUB_ENV"
      - name: Sequential suites, fresh23JS allrealms coverage, formal36 trials and B1 rows
        run: node scripts/migration-command/ci.js verify .artifacts/migration-command/ci-context.json
      - name: Remove only this job CA trust, Firefox profile and private keys
        if: always()
        shell: bash
        run: |
          tls="$GITHUB_WORKSPACE/.artifacts/migration-command/tls"
          crt=/usr/local/share/ca-certificates/formicarium-u4-job-ca.crt
          if [[ -f "$crt" ]]; then
            expected="$(openssl x509 -in "$tls/ca-cert.pem" -noout -fingerprint -sha256)"
            actual="$(openssl x509 -in "$crt" -noout -fingerprint -sha256)"
            [[ "$actual" = "$expected" ]]
            sudo rm -- "$crt"
            sudo update-ca-certificates
          fi
          if certutil -L -d "sql:$HOME/.pki/nssdb" -n formicarium-u4-job-ca >/dev/null 2>&1; then
            certutil -D -d "sql:$HOME/.pki/nssdb" -n formicarium-u4-job-ca
          fi
          rm -rf -- "$tls/firefox-profile"
          rm -f -- "$tls/localhost-key.pem" "$tls/ca-key.pem"
          [[ ! -e "$crt" ]]
          if certutil -L -d "sql:$HOME/.pki/nssdb" -n formicarium-u4-job-ca >/dev/null 2>&1; then
            echo 'job CA is still present in the NSS database' >&2
            exit 1
          fi
          [[ ! -e "$tls/firefox-profile" && ! -e "$tls/localhost-key.pem" && ! -e "$tls/ca-key.pem" ]]
      - name: Preserve current metadata, raw command logs, runner ledgers, realm/trial observations and B1 rows
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migration-command-u4-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .artifacts/migration-command/ci-context.json
            .artifacts/migration-session/core-restore.json
            .artifacts/migration-command/candidate-*/package.manifest.json
            .artifacts/migration-command/consumer-install-*.log
            .artifacts/migration-command/completion-*/*.log
            .artifacts/migration-command/completion-*/b1-acceptance.json
            .artifacts/migration-command/completion-*/local-provisional-report.json
            .artifacts/migration-command/completion-*/ci-job-observations.json
            .artifacts/migration-command/completion-*/incomplete.json
            .artifacts/migration-command/completion-*/coverage/coverage-report.json
            .artifacts/migration-command/completion-*/coverage/coverage-metadata.json
            .artifacts/migration-command/completion-*/coverage/coverage-node*.json
            .artifacts/migration-command/completion-*/coverage/coverage-session-node*.json
            .artifacts/migration-command/completion-*/coverage/command-collection-boundary.json
            .artifacts/migration-command/completion-*/coverage/coverage-playwright-generation.json
            .artifacts/migration-command/completion-*/coverage/coverage-playwright-node/**/*.json
            .artifacts/migration-command/completion-*/coverage/coverage-playwright-node/**/*.jsonl
            .artifacts/migration-command/completion-*/coverage/**/coverage-realms.json
            .artifacts/migration-command/completion-*/measurement/measurement-report.json
            .artifacts/migration-command/completion-*/measurement/trials/*.json
            .artifacts/migration-command/completion-*/measurement/incomplete.json
