            sudo update-ca-certificates
          fi
          if certutil -L -d "sql:$HOME/.pki/nssdb" -n formicarium-showcase-job-ca >/dev/null 2>&1; then
            certutil -D -d "sql:$HOME/.pki/nssdb" -n formicarium-showcase-job-ca
          fi
          rm -rf -- showcase/.work/tls
          [[ ! -e "$crt" && ! -e showcase/.work/tls ]]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: showcase-site-accept-webkit
          retention-days: 1
          if-no-files-found: error
          path: |
            showcase/site/.work/accept/
            showcase/site/.work/logs/inventory-accept-webkit.json
  coverage:
    needs: [build, accept-chromium, accept-firefox, accept-webkit]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.accept-chromium.result == 'success' && needs.accept-firefox.result == 'success' && needs.accept-webkit.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - name: Install the site dependencies (v8-to-istanbul)
        working-directory: showcase/site
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-site-build
          path: showcase/site/.work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-site-accept-chromium
          path: showcase/site/.work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-site-sourcemaps
          path: showcase/site/.work/sourcemaps
      - name: Merge node and Chromium coverage over the fixed denominator (80% lines)
        run: node showcase/site/tests/coverage/merge-coverage.ts --lcov showcase/site/.work/coverage/lcov.info --v8 showcase/site/.work/coverage/v8 --sourcemaps showcase/site/.work/sourcemaps --denominator showcase/site/coverage-denominator.json --out showcase/site/.work/coverage/report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: showcase-site-coverage
          retention-days: 1
          if-no-files-found: error
          path: showcase/site/.work/coverage/report/
  evidence:
    needs: [build, accept-chromium, accept-firefox, accept-webkit, coverage]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.accept-chromium.result == 'success' && needs.accept-firefox.result == 'success' && needs.accept-webkit.result == 'success' && needs.coverage.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: showcase-site-{build,accept-*}
          merge-multiple: true
          path: showcase/site/.work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-site-coverage
          path: showcase/site/.work/coverage/report
      - name: Assemble the C10 evidence (no deployedIdentity)
        env:
          SHOWCASE_SOURCE_COMMIT: ${{ github.sha }}
        run: node showcase/site/scripts/evidence.ts --stage pre
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-site-evidence-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: showcase/site/.work/evidence/pre/
  deploy:
    needs: [candidate, build, accept-chromium, accept-firefox, accept-webkit, coverage, evidence]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.candidate.result == 'success' && needs.build.result == 'success' && needs.accept-chromium.result == 'success' && needs.accept-firefox.result == 'success' && needs.accept-webkit.result == 'success' && needs.coverage.result == 'success' && needs.evidence.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: showcase-site-pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: showcase-site-{build,accept-*}
          merge-multiple: true
          path: showcase/site/.work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-site-coverage
          path: showcase/site/.work/coverage/report
      - name: Refuse a run older than the newest deployment (fail closed)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node showcase/site/scripts/deploy-guard.ts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: showcase/site/.work/pages
      - name: The artifact to deploy is the accepted site
        run: |
          mkdir -p showcase/site/dist
          tar -xf showcase/site/.work/pages/artifact.tar -C showcase/site/dist
          node showcase/site/scripts/inventory.ts --site showcase/site/dist --expect showcase/site/.work/build/site-inventory.json --log showcase/site/.work/logs/inventory-deploy.json
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Evidence of the deployed site (deployedIdentity)
        env:
          SHOWCASE_SOURCE_COMMIT: ${{ github.sha }}
        run: node showcase/site/scripts/evidence.ts --stage deployed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-site-evidence-${{ github.run_id }}-deployed
          retention-days: 90
          if-no-files-found: error
          path: showcase/site/.work/evidence/deployed/
  verify-deployment:
    needs: [build, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-site-build
          path: showcase/site/.work
      - name: The deployed site-identity.json names this run (30 s, at most 10 min)
        env:
          SHOWCASE_PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node showcase/site/scripts/post-deploy-check.ts
  summary:
    needs: [changes, candidate, fetch-candidate, verify-pack, build, accept-chromium, accept-firefox, accept-webkit, coverage, evidence, deploy, verify-deployment]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
          package-manager-cache: false
      - name: Days since the last deployment and the failed jobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SHOWCASE_DIST: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          SHOWCASE_NEEDS: ${{ toJSON(needs) }}
        run: node showcase/site/scripts/summary.ts
  required:
    name: showcase-site-required
    needs: [changes, candidate, fetch-candidate, verify-pack, build, accept-chromium, accept-firefox, accept-webkit, coverage, evidence, deploy, verify-deployment]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
          package-manager-cache: false
      - name: Every job this run needs succeeded (a PR without site changes passes)
        env:
          SHOWCASE_DIST: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          SHOWCASE_SITE: ${{ needs.changes.outputs.site }}
          SHOWCASE_NEEDS: ${{ toJSON(needs) }}
        run: node showcase/site/scripts/summary.ts --required
