name: Showcase site
on:
  # No timed trigger: the site deploys when its sources change on main, or by hand.
  workflow_dispatch:
  # Every PR runs (showcase-site-required must report); the changes job
  # decides whether the site jobs run.
  pull_request:
  push:
    branches: [main]
    paths:
      - showcase/site/**
      - .github/workflows/showcase-site.yml
      - showcase/scripts/**
permissions:
  contents: read
concurrency:
  # PR runs cancel older revisions; every other run is independent.
  group: showcase-site-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  ASTRO_TELEMETRY_DISABLED: '1'
# DIST (distribute) = (push || workflow_dispatch) && refs/heads/main. Every
# other run (PR, manual run of another branch) verifies and never deploys.
# A job whose `if:` has no status function also needs every ancestor job to
# succeed, and each path skips the other path's jobs, so every condition after
# the entry jobs starts with !cancelled().
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      site: ${{ steps.files.outputs.site }}
    steps:
      - id: files
        name: Does this PR touch the site paths (every other event builds the site)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo site=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$RUNNER_TEMP/pr-files.txt"
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$files"
          count=$(wc -l < "$files")
          echo "files: $count"
          # The API lists at most 3000 files; a longer PR builds the site.
          # The site also reads U7's tools.json, fixtures and b1-pack.json, so a
          # PR changing them verifies the site too (push still deploys only on
          # the site paths; deploy those inputs by hand).
          if [ "$count" -ge 3000 ] || grep -qE '^(showcase/site/|showcase/scripts/|showcase/fixtures/|showcase/tools\.json$|showcase/b1-pack\.json$|\.github/workflows/showcase-site\.yml$)' "$files"; then
            echo site=true >> "$GITHUB_OUTPUT"
          else
            echo site=false >> "$GITHUB_OUTPUT"
          fi
  candidate:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/showcase.yml
    with:
      mode: distribute
  fetch-candidate:
    needs: changes
    if: ${{ !((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') && needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
          package-manager-cache: false
      - name: Take the newest verify candidate of main's showcase.yml
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node showcase/site/scripts/fetch-verify-candidate.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-site-verify-candidate
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: showcase/site/.work/inputs/candidate/
  verify-pack:
    needs: changes
    if: ${{ !((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') && needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      # The same order as the verify pack of showcase.yml's resolve job.
      - name: Build this commit's package inputs
        run: |
          node scripts/ci/tasks.ts install-frozen
          node scripts/ci/tasks.ts build
          node scripts/migration-session/ci-core.js ci/migration-session/inputs.bundle.json
      - name: Pack this commit
        env:
          SHOWCASE_SOURCE_COMMIT: ${{ github.sha }}
        run: node showcase/scripts/pack.ts verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-site-verify-pack
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: showcase/.work/pack/
  build:
    needs: [candidate, fetch-candidate, verify-pack]
    if: ${{ !cancelled() && ((needs.candidate.result == 'success') || (needs.fetch-candidate.result == 'success' && needs.verify-pack.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SHOWCASE_MODE: ${{ needs.candidate.result == 'success' && 'distribute' || 'verify' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.SHOWCASE_MODE == 'distribute'
        with:
          name: showcase-candidate
          path: showcase/site/.work/inputs/candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.SHOWCASE_MODE == 'distribute'
        with:
          name: showcase-work-resolve
          path: showcase/site/.work/inputs/resolve
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.SHOWCASE_MODE == 'verify'
        with:
          name: showcase-site-verify-candidate
          path: showcase/site/.work/inputs/candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.SHOWCASE_MODE == 'verify'
        with:
          name: showcase-site-verify-pack
          path: showcase/site/.work/inputs/resolve/pack
      - name: Install the repository tools (Biome, TypeScript)
        run: node scripts/ci/tasks.ts install-frozen
      - name: Check the candidate (BR1.2) and stage the pack
        env:
          SHOWCASE_CANDIDATE_ID: ${{ needs.candidate.outputs.candidate-id }}
          SHOWCASE_DISTRIBUTABLE: ${{ needs.candidate.outputs.distributable }}
        run: node showcase/site/scripts/build-site.ts prepare --mode "$SHOWCASE_MODE"
      - name: Install the site dependencies (no install scripts)
        working-directory: showcase/site
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: node node_modules/@biomejs/biome/bin/biome check showcase/site biome.json
      - name: Public import boundary (U7 rules with the site rules)
        run: node showcase/scripts/boundary.ts | tee showcase/site/.work/logs/boundary.txt
      - name: Type check (tsc and astro check)
        working-directory: showcase/site
        run: |
          node node_modules/astro/bin/astro.mjs sync
          node node_modules/typescript/bin/tsc -p tsconfig.json
          (cd tooling/astro-check && bun install --frozen-lockfile --ignore-scripts)
          node tooling/astro-check/node_modules/@astrojs/check/bin/astro-check.js --root .
      - name: Unit tests (lcov for the coverage job)
        run: |
          mkdir -p showcase/site/.work/coverage
          node --test --test-concurrency=1 --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=showcase/site/.work/coverage/lcov.info showcase/site/tests/unit/*.test.ts
      - name: Workflow definition test (previous-site-preserved)
        run: node --test --test-reporter=tap --test-reporter-destination=showcase/site/.work/logs/workflow-test.tap showcase/site/tests/unit/workflow.test.ts
      - name: Assemble, check and inventory the site
        env:
          SHOWCASE_SOURCE_COMMIT: ${{ github.sha }}
        run: node showcase/site/scripts/build-site.ts assemble --mode "$SHOWCASE_MODE"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: showcase/site/dist
          retention-days: 7
          include-hidden-files: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-site-sourcemaps
          retention-days: 1
          if-no-files-found: error
          path: showcase/site/.work/sourcemaps/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-site-build
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: |
            showcase/site/.work/logs/
            showcase/site/.work/build/
            showcase/site/.work/coverage/lcov.info
            showcase/site/.work/inputs/candidate/manifest.json
            showcase/site/.work/inputs/candidate/acceptance-log.json
            showcase/site/.work/inputs/resolve/pack/pack.json
  accept-chromium:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BROWSER: chromium
      SHOWCASE_SITE_COVERAGE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - run: node scripts/ci/tasks.ts install-frozen
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: showcase/site/.work/pages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-site-build
          path: showcase/site/.work
      - name: Unpack the accepted Pages artifact and compare its inventory
        run: |
          mkdir -p showcase/site/dist
          tar -xf showcase/site/.work/pages/artifact.tar -C showcase/site/dist
          node showcase/site/scripts/inventory.ts --site showcase/site/dist --expect showcase/site/.work/build/site-inventory.json --log "showcase/site/.work/logs/inventory-accept-$BROWSER.json"
      - name: Create a job-only localhost CA and leaf (CA key deleted at once)
        run: node showcase/scripts/tls.ts create >> "$GITHUB_ENV"
      - name: Trust only this job CA (system store, NSS and a dedicated Firefox profile)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3-tools
          sudo install -m 644 "$SHOWCASE_TLS_CA" /usr/local/share/ca-certificates/formicarium-showcase-job-ca.crt
          sudo update-ca-certificates
          mkdir -p "$HOME/.pki/nssdb"
          certutil -N --empty-password -d "sql:$HOME/.pki/nssdb"
          certutil -A -d "sql:$HOME/.pki/nssdb" -n formicarium-showcase-job-ca -t 'C,,' -i "$SHOWCASE_TLS_CA"
          profile="$GITHUB_WORKSPACE/showcase/.work/tls/firefox-profile"
          mkdir "$profile"
          certutil -N --empty-password -d "sql:$profile"
          certutil -A -d "sql:$profile" -n formicarium-showcase-job-ca -t 'C,,' -i "$SHOWCASE_TLS_CA"
          [[ -f "$profile/cert9.db" && ! -L "$profile/cert9.db" ]]
          printf 'SHOWCASE_FIREFOX_PROFILE=%s\n' "$profile" >> "$GITHUB_ENV"
      - run: node node_modules/@playwright/test/cli.js install --with-deps "$BROWSER"
      - name: Site acceptance (16 tests, 1 worker, no retry, 180 s each)
        env:
          SHOWCASE_ACCEPT_RESULTS: ${{ github.workspace }}/showcase/site/.work/accept/chromium/results.json
        run: node node_modules/@playwright/test/cli.js test --config showcase/site/tests/playwright.config.ts --project="$BROWSER" --workers=1 --retries=0
      - name: Remove only this job CA trust, Firefox profile and private keys
        if: always()
        shell: bash
        run: |
          crt=/usr/local/share/ca-certificates/formicarium-showcase-job-ca.crt
          if [[ -f "$crt" ]]; then
            sudo rm -- "$crt"
            sudo update-ca-certificates
          fi
          if certutil -L -d "sql:$HOME/.pki/nssdb" -n formicarium-showcase-job-ca >/dev/null 2>&1; then
            certutil -D -d "sql:$HOME/.pki/nssdb" -n formicarium-showcase-job-ca
          fi
          rm -rf -- showcase/.work/tls
          [[ ! -e "$crt" && ! -e showcase/.work/tls ]]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: showcase-site-accept-chromium
          retention-days: 1
          if-no-files-found: error
          path: |
            showcase/site/.work/accept/
            showcase/site/.work/logs/inventory-accept-chromium.json
            showcase/site/.work/coverage/v8/
  accept-firefox:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BROWSER: firefox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
