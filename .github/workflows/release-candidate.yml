name: Release candidate

on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
    outputs:
      sha256:
        value: ${{ jobs.verify.outputs.sha256 }}
      version:
        value: ${{ jobs.verify.outputs.version }}
      dist-tag:
        value: ${{ jobs.verify.outputs.dist-tag }}
      artifact:
        value: ${{ jobs.verify.outputs.artifact }}

permissions:
  contents: read

jobs:
  # The candidate is packed once; four jobs then check those exact bytes in
  # parallel (Node and one per browser, each with one worker and no retries),
  # and the last job merges their checks and coverage into one record.
  prepare:
    name: Candidate preparation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORMICARIUM_CI_LATEST_TOOLS: '1'
      SOURCE_SHA: ${{ inputs.source-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: latest
          check-latest: true
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        id: bun
        with:
          bun-version: latest
      - run: bun scripts/ci/tasks.ts install-frozen --cacheless
      - run: bun add --dev --no-save --ignore-scripts @playwright/test@latest @biomejs/biome@latest typescript@latest
      - run: bun scripts/ci/tasks.ts build
      - name: Download reviewed external guest and consumer fixtures
        env:
          FORMICARIUM_MODERNIZATION_INPUT_URL: https://raw.githubusercontent.com/aletheia-works/formicarium/e206962ed3d7a7738b46d03c1106db392141381d/verification-inputs/candidate-0.2.0.tar.gz
          FORMICARIUM_MODERNIZATION_INPUT_SHA256: 9affaebeb6c2b6ed4fa212adbb7167124d4fd2793233e226ba3230efd7d2490f
        run: |
          python3 scripts/ci/install-modernization-inputs.py
          mv .ci-inputs .ci-fixtures
      - name: Stage the current package version and build
        run: bun scripts/package/stage-package.js --out .artifacts/release-candidate/private
      - name: Pack and verify the staged private inventory
        run: |
          bunx npm@latest pack ./.artifacts/release-candidate/private --ignore-scripts --pack-destination .artifacts/release-candidate
          mv .artifacts/release-candidate/aletheia-works-formicarium-*.tgz .artifacts/release-candidate/private.tgz
          bun scripts/package/verify-package.js .artifacts/release-candidate/private.manifest.json .artifacts/release-candidate/private.tgz
      - name: Prepare the public candidate without publishing
        run: bun scripts/ci/release-candidate.ts prepare-public
      - name: Pack the candidate once
        run: |
          bunx npm@latest pack ./.artifacts/release-candidate/public --ignore-scripts --pack-destination .artifacts/release-candidate
          mv .artifacts/release-candidate/aletheia-works-formicarium-*.tgz .artifacts/release-candidate/candidate.tgz
      - name: Bind fresh candidate bytes and current source to the fixtures
        run: bun scripts/ci/release-candidate.ts prepare-inputs
      - name: Hand the candidate and inputs to the checking jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          # The inputs and parts are named per run, not per attempt: a rerun of
          # only the failed jobs finds those of the attempts that made them, and
          # an attempt that makes them again replaces them. The candidate may
          # then merge parts of several attempts, which publication accepts
          # (GitHub lists carried-over jobs under the new attempt): every part
          # checked these same bytes, and a rerun of prepare reruns every part.
          name: release-candidate-inputs-${{ inputs.source-sha }}-${{ github.run_id }}
          overwrite: true
          path: |
            .artifacts/release-candidate/
            .ci-inputs/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  check:
    needs: prepare
    name: Candidate ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        part: [node, chromium, firefox, webkit]
    env:
      FORMICARIUM_CI_LATEST_TOOLS: '1'
      SOURCE_SHA: ${{ inputs.source-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: latest
          check-latest: true
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        id: bun
        with:
          bun-version: latest
      - run: bun scripts/ci/tasks.ts install-frozen --cacheless
      - run: bun add --dev --no-save --ignore-scripts @playwright/test@latest @biomejs/biome@latest typescript@latest
      - run: bun scripts/ci/tasks.ts build
      - name: Download this run's prepared candidate and inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-candidate-inputs-${{ inputs.source-sha }}-${{ github.run_id }}
          path: .
      - name: Install Playwright browsers
        if: matrix.part != 'node'
        uses: aletheia-works/.github/actions/install-playwright@237aeceec82d1ac86155fae871a80d4c1b436845 # v1.2.0
        with:
          browsers: ${{ matrix.part }}
          command: bun node_modules/@playwright/test/cli.js
      - name: Run this part's regression and coverage
        env:
          FORMICARIUM_CI_BUN: ${{ steps.bun.outputs.bun-path }}
          PART: ${{ matrix.part }}
        # The runner and instrumented Playwright suites use Node-specific APIs.
        run: GITHUB_SHA="$SOURCE_SHA" node scripts/ci/release-candidate.ts verify "$PART"
      - name: Keep this part's checks and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-candidate-part-${{ matrix.part }}-${{ inputs.source-sha }}-${{ github.run_id }}
          overwrite: true
          path: |
            .artifacts/ci-results/
            .artifacts/package-coverage/coverage-metadata.json
            .artifacts/package-coverage/coverage-node.json
            .artifacts/package-coverage/coverage-playwright-generation.json
            .artifacts/package-coverage/coverage-playwright-node/
            .artifacts/package-coverage/browser-results/
          include-hidden-files: true
          retention-days: 30
          # A part that failed before writing anything already failed its job;
          # the merge still refuses a missing part. A failed part also replaces
          # its earlier artifact; verify, which needs every check to pass, never
          # reads it.
          if-no-files-found: warn

  verify:
    needs: [prepare, check]
    outputs:
      sha256: ${{ steps.candidate.outputs.sha256 }}
      version: ${{ steps.candidate.outputs.version }}
      dist-tag: ${{ steps.candidate.outputs.dist-tag }}
      artifact: release-candidate-${{ inputs.source-sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    name: Candidate regression and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORMICARIUM_CI_LATEST_TOOLS: '1'
      SOURCE_SHA: ${{ inputs.source-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: latest
          check-latest: true
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        id: bun
        with:
          bun-version: latest
      - run: bun scripts/ci/tasks.ts install-frozen --cacheless
      - run: bun add --dev --no-save --ignore-scripts @playwright/test@latest @biomejs/biome@latest typescript@latest
      - run: bun scripts/ci/tasks.ts build
      - name: Download this run's prepared candidate and inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-candidate-inputs-${{ inputs.source-sha }}-${{ github.run_id }}
          path: .
      - name: Download this run's part results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-candidate-part-*-${{ inputs.source-sha }}-${{ github.run_id }}
          path: .artifacts/candidate-download
      - name: Name each part by its job
        run: |
          mkdir .artifacts/candidate-parts
          for part in node chromium firefox webkit; do
            mv ".artifacts/candidate-download/release-candidate-part-$part-$SOURCE_SHA-$GITHUB_RUN_ID" ".artifacts/candidate-parts/$part"
          done
      - name: Merge the parts' regression and coverage
        env:
          FORMICARIUM_CI_BUN: ${{ steps.bun.outputs.bun-path }}
        run: GITHUB_SHA="$SOURCE_SHA" node scripts/ci/release-candidate.ts merge .artifacts/candidate-parts
      - name: Export identity only after successful regression and coverage
        id: candidate
        run: |
          bun - <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const candidate = JSON.parse(readFileSync('.artifacts/release-candidate/candidate.json', 'utf8'));
          const acceptance = JSON.parse(readFileSync('.artifacts/ci-results/acceptance.json', 'utf8'));
          if (createHash('sha256').update(readFileSync('.artifacts/release-candidate/candidate.tgz')).digest('hex') !== candidate.tarball.sha256) throw Error('candidate tarball differs');
          if (!acceptance.passed || acceptance.context.commit !== process.env.SOURCE_SHA || candidate.identity.sourceCommit !== process.env.SOURCE_SHA || acceptance.checks.some(c => c.exitCode !== 0 || c.timedOut || c.skipped !== 0) || acceptance.coverage.lines.pct < 80 || acceptance.coverage.files.length !== 23) throw Error('candidate verification incomplete');
          appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${candidate.tarball.sha256}\nversion=${candidate.identity.version}\ndist-tag=${candidate.identity.distTag}\n`);
          JS
      - name: Keep candidate and measurement evidence from this run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-candidate-${{ inputs.source-sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/candidate-parts/
            .artifacts/release-candidate/candidate.tgz
            .artifacts/release-candidate/candidate.json
            .artifacts/release-candidate/package-manifest.json
            .artifacts/release-candidate/preparation.json
            .artifacts/ci-results/
            .artifacts/package-coverage/coverage-report.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
