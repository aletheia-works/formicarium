name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - 'infra/github/**'
      - '.github/workflows/terraform-apply.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  apply:
    if: github.repository == 'aletheia-works/formicarium'
    uses: aletheia-works/.github/.github/workflows/terraform-apply.yml@f1e71b990c2fd7086e78931ba8609b96ac68104b # v1.4.1
    with:
      working_directory: infra/github
      # No GitHub Environment gates this apply.
      environment: ''
    secrets: inherit
