name: Showcase guests
on:
  # Every PR runs (showcase-required must report); the changes job decides
  # whether the guest jobs run.
  pull_request:
  push:
    branches: [main]
    paths:
      - showcase/**
      - '!showcase/site/**'
      - .github/workflows/showcase.yml
      - runtime/**
      - types/**
      - package.json
  workflow_dispatch:
  workflow_call:
    inputs:
      mode:
        description: verify (default) or distribute (main showcase-site workflow only)
        type: string
        default: verify
    outputs:
      candidate-id:
        description: candidateId of the accepted candidate
        value: ${{ jobs.candidate.outputs.candidate-id }}
      distributable:
        description: true only for an accepted distribute run
        value: ${{ jobs.candidate.outputs.distributable }}
permissions:
  contents: read
concurrency:
  # PR runs cancel older revisions; every other run and call is independent.
  # A call takes its caller's name, so showcase-site's call on a PR does not
  # cancel this PR's own showcase run.
  group: showcase-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      guests: ${{ steps.files.outputs.guests }}
    steps:
      - id: files
        name: Does this PR touch the showcase or the public API (every other run builds the guests)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHOWCASE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          # A push, a manual run and a showcase-site call (which passes a mode)
          # always build; only this workflow's own PR runs are filtered.
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || [ -n "$SHOWCASE_MODE" ]; then
            echo guests=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$RUNNER_TEMP/pr-files.txt"
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$files"
          count=$(wc -l < "$files")
          echo "files: $count"
          # The paths of the push trigger; the API lists at most 3000 files, and
          # a longer PR builds the guests.
          # No pipe: under pipefail, grep -q closing it early would make a long
          # list read as no match.
          grep -v '^showcase/site/' "$files" > "$files.guests" || true
          if [ "$count" -ge 3000 ] || grep -qE '^(showcase/|runtime/|types/|package\.json$|\.github/workflows/showcase\.yml$)' "$files.guests"; then
            echo guests=true >> "$GITHUB_OUTPUT"
          else
            echo guests=false >> "$GITHUB_OUTPUT"
          fi
  resolve:
    needs: changes
    if: needs.changes.outputs.guests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '*'
          check-latest: true
          package-manager-cache: false
      - name: Read the main definition of the allow list and the pinned formicarium release
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - name: Accept the run mode
        id: mode
        env:
          SHOWCASE_MODE: ${{ inputs.mode }}
        run: node showcase/scripts/mode.ts
      - name: Resolve the latest stable releases once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node showcase/scripts/resolve.ts
      # The public package is needed by validateGuest in acquire, so the pack is
      # prepared here: verify packs this commit, distribute takes the pinned npm release.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.mode.outputs.mode == 'verify'
        with:
          bun-version: '1.4.3'
      - name: Build this commit's package inputs
        if: steps.mode.outputs.mode == 'verify'
        run: |
          node scripts/ci/tasks.ts install-frozen
          node scripts/ci/tasks.ts build
      - name: Prepare the package for the accepted mode
        env:
          SHOWCASE_SOURCE_COMMIT: ${{ github.sha }}
          SHOWCASE_MODE_RESOLVED: ${{ steps.mode.outputs.mode }}
        run: node showcase/scripts/pack.ts "$SHOWCASE_MODE_RESOLVED"
      - name: Record input digests
        if: always()
        env:
          SHOWCASE_MODE_RESOLVED: ${{ steps.mode.outputs.mode }}
        run: |
          {
            echo "### resolve ($SHOWCASE_MODE_RESOLVED)"
            sha256sum showcase/.work/resolutions.json showcase/.work/pack/pack.json 2>/dev/null | sed 's/^/    /' || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-work-resolve
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: |
            showcase/.work/resolutions.json
            showcase/.work/licenses/
            showcase/.work/pack/
            showcase/.work/tarballs/
            showcase/.work/ca/
  acquire:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '*'
          check-latest: true
          package-manager-cache: false
      - name: Read the main definition of the allow list
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-work-resolve
          path: showcase/.work
      - name: Install the recorded package after its SHA256 check
        run: node showcase/scripts/pack.ts install
      - name: Acquire official assets (published SHA256 and size, public validateGuest)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node showcase/scripts/acquire.ts
      # prepare reads musl-gcc's identity and libc.a into the buildKey and
      # unpacks GnuTLS's .tar.xz with xz; nettle's assembly goes through m4.
      - name: Install native build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools linux-libc-dev xz-utils m4
      - name: Prepare source builds (tag check, source, toolchain, buildKey)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node showcase/scripts/build.ts prepare
      - name: Reuse a matching candidate of a trusted main run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node showcase/scripts/reuse.ts
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: false
          cache: false
      # Upstream build scripts run here: no token is passed to this step.
      - name: Source build without token in its own process group
        run: node showcase/scripts/build.ts compile
      - name: Record acquired digests
        if: always()
        run: |
          {
            echo '### acquire'
            find showcase/.work/acquired -name acquired.json -exec sha256sum {} + 2>/dev/null | sed 's/^/    /' || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-work-acquired
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: showcase/.work/acquired/
  catalog:
    needs: [resolve, acquire]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '*'
          check-latest: true
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-work-resolve
          path: showcase/.work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-work-acquired
          path: showcase/.work/acquired
      - name: Install the recorded package after its SHA256 check
        run: node showcase/scripts/pack.ts install
      - name: Generate the catalog and check it with the public createInstaller
        run: node showcase/scripts/catalog.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-work-site
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: showcase/.work/site/
  accept:
    needs: [resolve, acquire, catalog]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '*'
          check-latest: true
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - run: node scripts/ci/tasks.ts install-frozen
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-work-resolve
          path: showcase/.work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-work-site
          path: showcase/.work/site
      - name: Install the recorded package after its SHA256 check
        run: node showcase/scripts/pack.ts install
      - name: Lint and type check showcase
        run: |
          node node_modules/@biomejs/biome/bin/biome check showcase biome.json
          node node_modules/typescript/bin/tsc -p showcase/tsconfig.json
      - name: Showcase unit tests with 80% line coverage of showcase/scripts
        run: node --test --test-concurrency=1 --experimental-test-coverage --test-coverage-include='showcase/scripts/**' --test-coverage-lines=80 showcase/tests/runner-ready.test.ts showcase/tests/config.test.ts showcase/tests/resolve.test.ts showcase/tests/gnu.test.ts showcase/tests/acquire.test.ts showcase/tests/archive.test.ts showcase/tests/build-key.test.ts showcase/tests/build.test.ts showcase/tests/reuse.test.ts showcase/tests/catalog.test.ts showcase/tests/pack.test.ts showcase/tests/candidate.test.ts showcase/tests/boundary.test.ts showcase/tests/mode.test.ts showcase/tests/workflow.test.ts
      - name: Public import boundary
        run: node showcase/scripts/boundary.ts
      - name: Create a job-only localhost CA and leaf (CA key deleted at once)
        run: node showcase/scripts/tls.ts create >> "$GITHUB_ENV"
      - name: Trust only this job CA (system store, NSS and a dedicated Firefox profile)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3-tools
          sudo install -m 644 "$SHOWCASE_TLS_CA" /usr/local/share/ca-certificates/formicarium-showcase-job-ca.crt
          sudo update-ca-certificates
          mkdir -p "$HOME/.pki/nssdb"
          certutil -N --empty-password -d "sql:$HOME/.pki/nssdb"
          certutil -A -d "sql:$HOME/.pki/nssdb" -n formicarium-showcase-job-ca -t 'C,,' -i "$SHOWCASE_TLS_CA"
          profile="$GITHUB_WORKSPACE/showcase/.work/tls/firefox-profile"
          mkdir "$profile"
          certutil -N --empty-password -d "sql:$profile"
          certutil -A -d "sql:$profile" -n formicarium-showcase-job-ca -t 'C,,' -i "$SHOWCASE_TLS_CA"
          [[ -f "$profile/cert9.db" && ! -L "$profile/cert9.db" ]]
          printf 'SHOWCASE_FIREFOX_PROFILE=%s\n' "$profile" >> "$GITHUB_ENV"
      - name: Node acceptance through the public /node export
        run: node showcase/scripts/accept-node.ts
      - name: Install Playwright browsers
        uses: aletheia-works/.github/actions/install-playwright@f5bb52fe38d6ddf151662ed6b64c0b23eeb50ec4 # v1.3.3
        with:
          browsers: chromium firefox webkit
          command: node node_modules/@playwright/test/cli.js
      - name: Chromium, Firefox and WebKit acceptance through the public /browser export
        run: node node_modules/@playwright/test/cli.js test --config showcase/tests/playwright.config.ts --workers=1 --retries=0
      - name: Remove only this job CA trust, Firefox profile and private keys
        if: always()
        shell: bash
        run: |
          crt=/usr/local/share/ca-certificates/formicarium-showcase-job-ca.crt
          if [[ -f "$crt" ]]; then
            sudo rm -- "$crt"
            sudo update-ca-certificates
          fi
          if certutil -L -d "sql:$HOME/.pki/nssdb" -n formicarium-showcase-job-ca >/dev/null 2>&1; then
            certutil -D -d "sql:$HOME/.pki/nssdb" -n formicarium-showcase-job-ca
          fi
          rm -rf -- showcase/.work/tls
          [[ ! -e "$crt" && ! -e showcase/.work/tls ]]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-work-acceptance
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: showcase/.work/acceptance/
  # Real Safari, not Playwright's WebKit build: safaridriver drives the Safari
  # that ships with macOS through the same page function, one tool at a time.
  accept-safari:
    needs: [resolve, acquire, catalog]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '*'
          check-latest: true
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-work-resolve
          path: showcase/.work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-work-site
          path: showcase/.work/site
      - name: Install the recorded package after its SHA256 check
        run: node showcase/scripts/pack.ts install
      - name: Record the macOS and Safari versions
        run: |
          sw_vers
          defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString
      - name: Create a job-only localhost CA and leaf (CA key deleted at once)
        run: node showcase/scripts/tls.ts create >> "$GITHUB_ENV"
      - name: Trust only this job CA (System keychain)
        shell: bash
        run: |
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$SHOWCASE_TLS_CA"
          # Fail here, not in Safari, if the leaf is not trusted for localhost.
          security verify-cert -c "$SHOWCASE_TLS_CERT" -p ssl -s localhost
      - name: Allow safaridriver to drive Safari
        run: sudo safaridriver --enable
      - name: Safari acceptance through the public /browser export
        run: |
          safaridriver --port 4444 &
          driver=$!
          trap 'kill "$driver"' EXIT
          node showcase/tests/accept-safari.ts
      # The job CA is deleted from the keychain; an admin trust entry may stay on
      # this throwaway runner. remove-trusted-cert waited for an admin prompt
      # that a runner never answers, so it is not used.
      - name: Remove only this job CA trust and private keys
        if: always()
        timeout-minutes: 5
        shell: bash
        run: |
          if [[ -f "${SHOWCASE_TLS_CA:-}" ]]; then
            hash=$(openssl x509 -in "$SHOWCASE_TLS_CA" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)
            # A variable, not a pipe: grep -q could end the pipe early under pipefail.
            listed=$(sudo security find-certificate -Z -a /Library/Keychains/System.keychain)
            if grep -q "SHA-1 hash: $hash" <<< "$listed"; then
              sudo security delete-certificate -Z "$hash" /Library/Keychains/System.keychain
            fi
          fi
          rm -rf -- showcase/.work/tls
          [[ ! -e showcase/.work/tls ]]
          if sudo security find-certificate -c formicarium-showcase-job-ca /Library/Keychains/System.keychain >/dev/null 2>&1; then
            echo 'the job CA is still in the System keychain' >&2
            exit 1
          fi
          # Recorded only: shows whether an admin trust entry was left behind.
          security dump-trust-settings -d || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-work-acceptance-safari
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: showcase/.work/acceptance/
  candidate:
    needs: [resolve, acquire, catalog, accept, accept-safari]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      candidate-id: ${{ steps.candidate.outputs.candidate-id }}
      distributable: ${{ steps.candidate.outputs.distributable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '*'
          check-latest: true
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-work-resolve
          path: showcase/.work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-work-acquired
          path: showcase/.work/acquired
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-work-site
          path: showcase/.work/site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-work-acceptance
          path: showcase/.work/acceptance
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-work-acceptance-safari
          path: showcase/.work/acceptance
      - name: Install the recorded package after its SHA256 check
        run: node showcase/scripts/pack.ts install
      - name: Assemble the candidate and its manifest
        id: candidate
        env:
          SHOWCASE_MODE_RESOLVED: ${{ needs.resolve.outputs.mode }}
          SHOWCASE_SOURCE_COMMIT: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node showcase/scripts/candidate.ts
      # Uploaded only after every job and check above succeeded.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-candidate
          if-no-files-found: error
          include-hidden-files: true
          path: showcase/.work/candidate/
  required:
    name: showcase-required
    needs:
      [changes, resolve, acquire, catalog, accept, accept-safari, candidate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job this run needs succeeded (a PR without showcase changes passes)
        env:
          SHOWCASE_GUESTS: ${{ needs.changes.outputs.guests }}
          SHOWCASE_NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # changes must pass; the guest jobs must all pass when the guests
          # are built and must all be skipped when they are not.
          want=skipped
          [ "$SHOWCASE_GUESTS" = true ] && want=success
          bad=$(jq -r --arg want "$want" 'to_entries[]
            | select((.key == "changes" and .value.result != "success")
                or (.key != "changes" and .value.result != $want))
            | "\(.key): \(.value.result)"' <<< "$SHOWCASE_NEEDS")
          if [ -n "$bad" ]; then
            echo "::error::guests=$SHOWCASE_GUESTS, but: $bad"
            exit 1
          fi
          echo "guests=$SHOWCASE_GUESTS: every needed job is $want"
