name: Infrastructure validation
on:
  pull_request:
    paths:
      - 'infra/github/**'
      - 'infra/aws/**'
      - '.github/workflows/*terraform*'
      - '.github/workflows/tofu-fmt-autofix.yml'
      - '.github/workflows/infra-check.yml'
  push:
    branches: [main]
    paths:
      ['infra/github/**', 'infra/aws/**', '.github/workflows/infra-check.yml']
permissions:
  contents: read
jobs:
  validate:
    name: Validate ${{ matrix.module }} infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [github, aws]
    defaults:
      run:
        working-directory: infra/${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: latest
          tofu_wrapper: false
      - run: tofu init -backend=false -input=false -lockfile=readonly
      - run: tofu fmt -check -recursive
      - run: tofu validate
