name: CI
on:
  pull_request:
  push:
    branches: [main]
env:
  FORMICARIUM_CI_LATEST_TOOLS: '1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'latest'
          check-latest: true
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 'latest'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-latest-node-latest-${{ hashFiles('bun.lock') }}
      - run: bun scripts/ci/tasks.ts install-frozen
      - run: git diff --exit-code -- bun.lock package.json
      - name: Use the latest Playwright without changing the dependency lock
        run: bun add --dev --no-save --ignore-scripts @playwright/test@latest @biomejs/biome@latest typescript@latest
      - run: bun scripts/ci/tasks.ts lint
      - run: bun scripts/ci/tasks.ts typecheck
      - run: bun scripts/ci/tasks.ts build
      - name: Run light tests with the installed latest Bun
        run: BUN_EXECUTABLE="$(command -v bun)" bun scripts/ci/tasks.ts test-light
  product-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      FORMICARIUM_CONTAINER: docker
      FORMICARIUM_EMSDK_IMAGE: emscripten/emsdk:latest
      AUBE_REF: v2.7.0
      PITCHFORK_REF: v2.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'latest'
          check-latest: true
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 'latest'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun add --dev --no-save --ignore-scripts @playwright/test@latest @biomejs/biome@latest typescript@latest
      - name: Record resolved test tool versions
        run: |
          bun --version
          node --version
          bun node_modules/@playwright/test/cli.js --version
          cat /etc/os-release
      - run: bun run --bun build
      # The locked blink commit is supplied by a reviewed source bundle until
      # it is available directly from the core repository. No built product
      # or consumer dependencies from the archive are reused in this job.
      - name: Fetch fixed core source input
        env:
          FORMICARIUM_MODERNIZATION_INPUT_URL: https://raw.githubusercontent.com/aletheia-works/formicarium/674a7f0a1b1736a2df61a994ab2dac29dddb8ace/modernization-inputs.tar.gz
          FORMICARIUM_MODERNIZATION_INPUT_SHA256: 0b074f0ebc170fbabed0fbe1d8bfad9628247a4131f78223db8c343412c38730
        run: python3 scripts/ci/install-modernization-inputs.py
      - name: Prepare locked core source
        run: |
          mkdir -p .artifacts/ci-candidate
          cp .ci-inputs/payload/.artifacts/ci-candidate/core-source.bundle .artifacts/ci-candidate/
          bun run - <<'JS'
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import { bootstrapCoreSource } from './scripts/ci/core-source.js';
          const manifest = JSON.parse(readFileSync('.ci-inputs/manifest.json', 'utf8'));
          await bootstrapCoreSource(process.cwd(), manifest, async (id, args) => {
            const result = spawnSync(args[0], args.slice(1), { stdio: 'inherit' });
            if (result.error) throw result.error;
            if (result.status !== 0) throw new Error(`${id} failed: ${result.status}`);
          });
          JS
      - name: Resolve current build container images
        id: build-images
        run: |
          docker pull emscripten/emsdk:latest
          docker pull rust:alpine
          docker pull node:current-alpine
          digest=$(docker image inspect --format '{{.Id}}' emscripten/emsdk:latest rust:alpine node:current-alpine | sha256sum | cut -d ' ' -f 1)
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Cache builds for the exact current compiler images and inputs
        id: product-build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dist/blink/
            dist/guests/
          key: product-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-images.outputs.digest }}-${{ hashFiles('.github/workflows/ci.yml', 'blink.lock', 'scripts/**/*.sh', 'scripts/**/*.ts', 'guest/**', 'patches/**') }}
      - name: Build wasm core from source
        if: steps.product-build.outputs.cache-hit != 'true'
        run: bash scripts/build-blink-wasm.sh
      - name: Build static Linux probe guests from source
        if: steps.product-build.outputs.cache-hit != 'true'
        run: bash scripts/build-guests.sh probe
      - name: Build static Linux aube from source
        if: steps.product-build.outputs.cache-hit != 'true'
        run: bash scripts/build-guests.sh aube
      - name: Build unpatched static Linux pitchfork from source
        if: steps.product-build.outputs.cache-hit != 'true'
        run: bash scripts/build-guests.sh pitchfork
      - name: Verify reproducible native baselines
        run: |
          docker run --rm -v "$PWD/dist/guests:/guests:ro" rust:alpine /guests/probe bsf-zero
          cp fixtures/baseline/aube-1645.native.txt "$RUNNER_TEMP/aube.native.txt"
          cp fixtures/baseline/pitchfork-basic.native.txt "$RUNNER_TEMP/pitchfork.native.txt"
          bash scripts/native-baseline.sh aube-1645 --check-reproducible
          bash scripts/native-baseline.sh pitchfork-basic --check-reproducible
          diff -u "$RUNNER_TEMP/aube.native.txt" fixtures/baseline/aube-1645.native.txt
          diff -u "$RUNNER_TEMP/pitchfork.native.txt" fixtures/baseline/pitchfork-basic.native.txt
      - name: Run product regression tests on Node
        run: node --test --test-concurrency=1 tests/node/build.test.js tests/node/runner.test.js tests/node/probe.test.js tests/node/session.test.js tests/node/aube-1645.test.js tests/node/pitchfork-basic.test.js
      - name: Install browsers matching the latest Playwright
        run: bunx --bun --no-install playwright install --with-deps chromium firefox webkit
      - name: Run browser regression tests sequentially
        run: bun run --bun test:browser -- --workers=1 --retries=0
      - name: Save compiled products and browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-tests-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            dist/blink/
            dist/guests/
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
  commit-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
          path: .trusted-base
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 'latest'
      - name: Load reviewed validator for the initial migration only
        if: ${{ (github.event.pull_request.base.sha || github.event.before) == '12a92eabf70f6772f11e33f698e3db5088992270' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7fc23afedef9a2296cb24026c0f19998a6933da7
          path: .trusted-bootstrap
          persist-credentials: false
      - name: Validate with trusted base rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TRUSTED_VALIDATOR: ${{ (github.event.pull_request.base.sha || github.event.before) == '12a92eabf70f6772f11e33f698e3db5088992270' && '.trusted-bootstrap/scripts/ci/commit-format.ts' || '.trusted-base/scripts/ci/commit-format.ts' }}
        run: bun "$TRUSTED_VALIDATOR" "$BASE_SHA" "$HEAD_SHA"
  ci-required:
    if: always()
    needs: [quality, product-tests, commit-format]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 'latest'
      - name: Record observed job outcomes
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OBSERVED_JOBS: ${{ toJSON(needs) }}
        run: bun scripts/ci/ordinary-receipt.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ordinary-ci-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ordinary-ci/receipt.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Require successful quality and commit checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          PRODUCT_RESULT: ${{ needs.product-tests.result }}
          COMMIT_RESULT: ${{ needs.commit-format.result }}
        run: test "$QUALITY_RESULT" = success && test "$COMMIT_RESULT" = success && test "$PRODUCT_RESULT" = success
