name: 'CI'
'on':
  workflow_call:
    outputs:
      candidate-sha256:
        value: ${{ jobs.release-candidate.outputs.sha256 }}
      candidate-version:
        value: ${{ jobs.release-candidate.outputs.version }}
      candidate-dist-tag:
        value: ${{ jobs.release-candidate.outputs.dist-tag }}
      candidate-artifact:
        value: ${{ jobs.release-candidate.outputs.artifact }}
  workflow_dispatch: null
  pull_request: null
  push:
    branches:
      - 'main'
env:
  FORMICARIUM_CI_LATEST_TOOLS: '1'
permissions:
  contents: 'read'
concurrency:
  group: 'ci-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true
jobs:
  # Which job groups this pull request's changed files need
  # (scripts/ci-changes.py). A release PR and every other event run quality
  # and product; the release candidate runs for the release PR, its own code,
  # a manual run and a v* tag, as before.
  changes:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      contents: 'read'
      pull-requests: 'read'
    outputs:
      quality: '${{ steps.groups.outputs.quality }}'
      product: '${{ steps.groups.outputs.product }}'
      candidate: '${{ steps.groups.outputs.candidate }}'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
      - run: 'python3 scripts/ci-changes.py --self-test'
      - id: 'groups'
        env:
          GH_TOKEN: '${{ github.token }}'
          EVENT_NAME: '${{ github.event_name }}'
          HEAD_REF: '${{ github.head_ref }}'
          PR: '${{ github.event.pull_request.number }}'
        run: |-
          if [ "$EVENT_NAME" = pull_request ] && [ "$HEAD_REF" != release-please--branches--main--components--formicarium ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
              --jq '.[] | .filename, (.previous_filename // empty)' |
              python3 scripts/ci-changes.py
          elif [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = workflow_dispatch ] || [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            python3 scripts/ci-changes.py --all
          else
            printf 'quality=true\nproduct=true\ncandidate=false\n' | tee -a "$GITHUB_OUTPUT"
          fi
  quality:
    needs: 'changes'
    if: "needs.changes.outputs.quality == 'true'"
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
      - uses: 'actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1' # v7.1.0
        with:
          node-version: 'latest'
          check-latest: true
          package-manager-cache: false
      - uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # v2.2.0
        with:
          bun-version: 'latest'
      - uses: 'actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' # v6.1.0
        with:
          path: '~/.bun/install/cache'
          key: "${{ runner.os }}-bun-latest-node-latest-${{ hashFiles('bun.lock') }}"
      - run: 'bun scripts/ci/tasks.ts install-frozen'
      - run: 'git diff --exit-code -- bun.lock package.json'
      - name: 'Use the latest Playwright without changing the dependency lock'
        run: 'bun add --dev --no-save --ignore-scripts @playwright/test@latest @biomejs/biome@latest typescript@latest'
      - run: 'bun scripts/ci/tasks.ts lint'
      - run: 'bun scripts/ci/tasks.ts typecheck'
      - run: 'bun scripts/ci/tasks.ts build'
      - name: 'Run light tests with the installed latest Bun'
        run: 'BUN_EXECUTABLE="$(command -v bun)" bun scripts/ci/tasks.ts test-light'
  product-build:
    name: 'Build (${{ matrix.component }})'
    needs: 'changes'
    if: "needs.changes.outputs.product == 'true'"
    runs-on: 'ubuntu-latest'
    timeout-minutes: 140
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: 'probe'
            image: 'rust:alpine'
            output: 'dist/guests/'
            source: 'guest/probe/**'
            lock: 'guest/probe/Cargo.lock'
            script: 'mise-tasks/build/guests.sh'
          - component: 'guests'
            image: 'rust:alpine'
            output: 'dist/guests/'
            source: 'mise-tasks/build/guests.sh'
            lock: 'scripts/lib/container.sh'
            script: 'mise-tasks/build/guests.sh'
    env:
      FORMICARIUM_CONTAINER: 'docker'
      AUBE_REF: 'v2.7.0'
      PITCHFORK_REF: 'v2.30.1'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
      - uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # v2.2.0
        with:
          bun-version: 'latest'
        if: "matrix.component != 'probe'"
      - run: 'bun install --frozen-lockfile --ignore-scripts'
        if: "matrix.component != 'probe'"
      - run: 'bun add --dev --no-save --ignore-scripts @playwright/test@latest @biomejs/biome@latest typescript@latest'
        if: "matrix.component != 'probe'"
      - run: 'bun run --bun build'
        if: "matrix.component != 'probe'"
      - name: 'Resolve current compiler images'
        id: 'build-image'
        env:
          BUILD_IMAGE: '${{ matrix.image }}'
          COMPONENT: '${{ matrix.component }}'
        run: |-
          docker pull "$BUILD_IMAGE"
          printf 'digest=%s\n' "$(docker image inspect --format '{{.Id}}' "$BUILD_IMAGE")" >> "$GITHUB_OUTPUT"
          if [ "$COMPONENT" = guests ]; then
            docker pull node:current-alpine
            digest=$(docker image inspect --format '{{.Id}}' rust:alpine node:current-alpine | sha256sum | cut -d ' ' -f 1)
            printf 'ui-digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
            docker pull alpine:latest
            printf 'c-digest=%s\n' "$(docker image inspect --format '{{.Id}}' alpine:latest)" >> "$GITHUB_OUTPUT"
          fi
      - name: 'Cache probe by compiler and build inputs'
        if: "matrix.component == 'probe'"
        id: 'product-cache'
        uses: 'actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' # v6.1.0
        with:
          path: '${{ matrix.output }}'
          key: "product-${{ matrix.component }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-image.outputs.digest }}-${{ hashFiles(matrix.source, matrix.lock, matrix.script, 'scripts/lib/container.sh', 'scripts/lib/node.sh') }}"
      - name: 'Build static Linux probe guests'
        if: "matrix.component == 'probe' && steps.product-cache.outputs.cache-hit != 'true'"
        run: 'bash mise-tasks/build/guests.sh probe'
      - name: 'Verify BSF natively before trusting wasm tests'
        if: "matrix.component == 'probe'"
        run: 'docker run --rm -v "$PWD/dist/guests:/guests:ro" rust:alpine /guests/probe bsf-zero'
      - name: 'Restore aube by Rust compiler and its own build inputs'
        if: "matrix.component == 'guests'"
        id: 'aube-cache'
        uses: 'actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' # v6.1.0
        with:
          path: 'dist/guests/aube*'
          key: "product-aube-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-image.outputs.digest }}-${{ env.AUBE_REF }}-${{ hashFiles('mise-tasks/build/guests.sh', 'scripts/lib/container.sh') }}"
      - name: 'Build static Linux aube'
        if: "matrix.component == 'guests' && steps.aube-cache.outputs.cache-hit != 'true'"
        run: 'bash mise-tasks/build/guests.sh aube'
      - name: 'Save aube before downstream work can fail'
        if: "matrix.component == 'guests' && steps.aube-cache.outputs.cache-hit != 'true'"
        uses: 'actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' # v6.1.0
        with:
          path: 'dist/guests/aube*'
          key: '${{ steps.aube-cache.outputs.cache-primary-key }}'
      - name: 'Restore pitchfork by compilers, aube bytes and build inputs'
        if: "matrix.component == 'guests'"
        id: 'pitchfork-cache'
        uses: 'actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' # v6.1.0
        with:
          path: 'dist/guests/pitchfork*'
          key: "product-pitchfork-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-image.outputs.ui-digest }}-${{ env.PITCHFORK_REF }}-${{ hashFiles('dist/guests/aube', 'mise-tasks/build/guests.sh', 'scripts/lib/container.sh') }}"
      - name: 'Build unpatched pitchfork with the latest UI Node'
        if: "matrix.component == 'guests' && steps.pitchfork-cache.outputs.cache-hit != 'true'"
        run: 'bash mise-tasks/build/guests.sh pitchfork'
      - name: 'Save pitchfork before downstream tests can fail'
        if: "matrix.component == 'guests' && steps.pitchfork-cache.outputs.cache-hit != 'true'"
        uses: 'actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' # v6.1.0
        with:
          path: 'dist/guests/pitchfork*'
          key: '${{ steps.pitchfork-cache.outputs.cache-primary-key }}'
      - name: 'Restore nano by C compiler image and build inputs'
        if: "matrix.component == 'guests'"
        id: 'nano-cache'
        uses: 'actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' # v6.1.0
        with:
          path: 'dist/guests/nano*'
          key: "product-nano-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-image.outputs.c-digest }}-${{ hashFiles('mise-tasks/build/guests.sh', 'scripts/lib/container.sh') }}"
      - name: 'Build unpatched nano and ncurses from digest-checked tarballs'
        if: "matrix.component == 'guests' && steps.nano-cache.outputs.cache-hit != 'true'"
        run: 'bash mise-tasks/build/guests.sh nano'
      - name: 'Save nano before downstream tests can fail'
        if: "matrix.component == 'guests' && steps.nano-cache.outputs.cache-hit != 'true'"
        uses: 'actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' # v6.1.0
        with:
          path: 'dist/guests/nano*'
          key: '${{ steps.nano-cache.outputs.cache-primary-key }}'
      - name: 'Verify reproducible native baselines'
        run: |-
          cp fixtures/baseline/aube-1645.native.txt "$RUNNER_TEMP/aube.native.txt"
          cp fixtures/baseline/pitchfork-basic.native.txt "$RUNNER_TEMP/pitchfork.native.txt"
          bash mise-tasks/build/native-baseline.sh aube-1645 --check-reproducible
          bash mise-tasks/build/native-baseline.sh pitchfork-basic --check-reproducible
          diff -u "$RUNNER_TEMP/aube.native.txt" fixtures/baseline/aube-1645.native.txt
          diff -u "$RUNNER_TEMP/pitchfork.native.txt" fixtures/baseline/pitchfork-basic.native.txt
        if: "matrix.component == 'guests'"
      - name: 'Share compiled products with downstream jobs'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
        with:
          # Named per run, not per attempt: a rerun of only the failed jobs
          # finds the products of the attempt that built them, and a rebuild
          # in a later attempt replaces them.
          name: 'product-build-${{ matrix.component }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}'
          overwrite: true
          path: 'dist/'
          retention-days: 7
          if-no-files-found: 'error'
  product-regression:
    name: 'Product (${{ matrix.suite }})'
    runs-on: 'ubuntu-latest'
    needs:
      - 'product-build'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        suite:
          - 'node'
          - 'chromium'
          - 'firefox'
          - 'webkit'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
      - uses: 'actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1' # v7.1.0
        with:
          node-version: 'latest'
          check-latest: true
          package-manager-cache: false
        if: "matrix.suite == 'node'"
      - uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # v2.2.0
        with:
          bun-version: 'latest'
      - run: 'bun install --frozen-lockfile --ignore-scripts'
      - run: 'bun add --dev --no-save --ignore-scripts @playwright/test@latest @biomejs/biome@latest typescript@latest'
      - run: 'bun run --bun build'
      - name: 'Download products built by this source and run'
        uses: 'actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333' # v8.0.2
        with:
          pattern: 'product-build-*-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}'
          path: 'dist'
          merge-multiple: true
      - name: 'Restore guest executable permissions'
        run: 'chmod +x dist/guests/probe dist/guests/hello dist/guests/exit3 dist/guests/ttyecho dist/guests/aube dist/guests/pitchfork dist/guests/nano'
      - name: 'Record resolved tools for this suite'
        run: |-
          bun --version
          bun node_modules/@playwright/test/cli.js --version
          cat /etc/os-release
      - name: 'Run product regression tests on Node'
        run: 'node --test --test-concurrency=1 tests/node/build.test.js tests/node/runner.test.js tests/node/probe.test.js tests/node/session.test.js tests/node/interactive.test.js tests/node/installed-guests.test.js tests/node/aube-1645.test.js tests/node/pitchfork-basic.test.js'
        if: "matrix.suite == 'node'"
      - name: 'Install only this latest Playwright browser'
        if: "matrix.suite != 'node'"
        uses: 'aletheia-works/.github/actions/install-playwright@237aeceec82d1ac86155fae871a80d4c1b436845' # v1.2.0
        with:
          browsers: '${{ matrix.suite }}'
          command: 'bunx --bun --no-install playwright'
      - name: 'Run this browser suite with one worker and no retries'
        if: "matrix.suite != 'node'"
        env:
          BROWSER: '${{ matrix.suite }}'
          # The browser's own stderr and exit, so a crashed page leaves its reason.
          DEBUG: 'pw:browser'
        run: |-
          set -o pipefail
          mkdir -p browser-logs
          bun run --bun test:browser -- --project "$BROWSER" --workers=1 --retries=0 2>&1 | tee browser-logs/playwright.log
      - name: 'Record kernel messages, such as an out-of-memory kill, after a failed browser suite'
        if: "failure() && matrix.suite != 'node'"
        run: |-
          mkdir -p browser-logs
          sudo dmesg --ctime | tail -n 500 > browser-logs/dmesg.txt
      - name: 'Retain this suite diagnostics'
        if: 'always()'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
        with:
          name: 'product-diagnostics-${{ matrix.suite }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}'
          path: |-
            playwright-report/
            test-results/
            browser-logs/
          retention-days: 7
          if-no-files-found: 'warn'
  # Real Safari, not Playwright's WebKit build: safaridriver drives the Safari
  # that ships with macOS through the probe page and the install and command
  # API checks, one session and no retries.
  product-safari:
    name: 'Product (safari)'
    runs-on: 'macos-latest'
    needs:
      - 'product-build'
    timeout-minutes: 90
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
      - uses: 'actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1' # v7.1.0
        with:
          node-version: 'latest'
          check-latest: true
          package-manager-cache: false
      - uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # v2.2.0
        with:
          bun-version: 'latest'
      - run: 'bun install --frozen-lockfile --ignore-scripts'
      - run: 'bun add --dev --no-save --ignore-scripts @playwright/test@latest @biomejs/biome@latest typescript@latest'
      - run: 'bun run --bun build'
      - name: 'Download products built by this source and run'
        uses: 'actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333' # v8.0.2
        with:
          pattern: 'product-build-*-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}'
          path: 'dist'
          merge-multiple: true
      - name: 'Restore guest executable permissions'
        run: 'chmod +x dist/guests/probe dist/guests/hello dist/guests/exit3 dist/guests/ttyecho'
      - name: 'Record the macOS and Safari versions'
        run: |-
          sw_vers
          defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString
      - name: 'Allow safaridriver to drive Safari'
        run: 'sudo safaridriver --enable'
      - name: 'Run the probe page and the install and command checks in real Safari'
        run: |-
          safaridriver --port 4444 &
          driver=$!
          trap 'kill "$driver"' EXIT
          node --test --test-concurrency=1 tests/browser/safari-probe.test.js
  # The same checks in Safari on iOS: an iPhone on the newest iOS 26 Simulator
  # runtime, with the image's default Xcode 26. Xcode 27 replaced
  # Simulator.app with Device Hub, and safaridriver 27.0.1 finds no iOS
  # Simulator session host with it, so Xcode 27 and iOS 27 are not run yet.
  # The simulator runs on the Mac's CPU and memory, so it is not a check of an
  # iPhone's memory limits.
  product-safari-ios:
    name: 'Product (safari-ios)'
    runs-on: 'macos-latest'
    needs:
      - 'product-build'
    timeout-minutes: 90
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
      - uses: 'actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1' # v7.1.0
        with:
          node-version: 'latest'
          check-latest: true
          package-manager-cache: false
      - uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # v2.2.0
        with:
          bun-version: 'latest'
      - run: 'bun install --frozen-lockfile --ignore-scripts'
      - run: 'bun add --dev --no-save --ignore-scripts @playwright/test@latest @biomejs/biome@latest typescript@latest'
      - run: 'bun run --bun build'
      - name: 'Download products built by this source and run'
        uses: 'actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333' # v8.0.2
        with:
          pattern: 'product-build-*-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}'
          path: 'dist'
          merge-multiple: true
      - name: 'Restore guest executable permissions'
        run: 'chmod +x dist/guests/probe dist/guests/hello dist/guests/exit3 dist/guests/ttyecho'
      # The image's default Xcode (/Applications/Xcode.app), not one picked with
      # xcode-select: with Xcode_26.6.app selected, safaridriver answered
      # "Could not find Simulator.app or a devices:// URL handler".
      - name: 'Use the default Xcode, an Xcode 26 that still ships Simulator.app'
        run: |-
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 26\.'
          test -d "$(xcode-select -p)/Applications/Simulator.app"
      - name: 'Boot an iPhone on the newest iOS 26 Simulator runtime'
        run: |-
          runtimes=$(xcrun simctl list runtimes --json)
          runtime=$(jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable and (.version | startswith("26.")))] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty' <<< "$runtimes")
          if [ -z "$runtime" ]; then
            jq -r '.runtimes[] | select(.platform == "iOS") | "\(.name) (\(.buildversion))"' <<< "$runtimes"
            echo 'no iOS 26 Simulator runtime on this runner' >&2
            exit 1
          fi
          jq -r --arg runtime "$runtime" '.runtimes[] | select(.identifier == $runtime) | "\(.name) (\(.buildversion))"' <<< "$runtimes"
          device_type=$(xcrun simctl list devices available --json | jq -r --arg runtime "$runtime" '[.devices[$runtime][] | select(.name | startswith("iPhone"))] | first | .deviceTypeIdentifier')
          echo "$device_type"
          # One booted simulator with a name of its own: the image may boot its
          # own iPhone, and safaridriver then waits on the wrong one.
          xcrun simctl shutdown all
          device=$(xcrun simctl create formicarium-iphone "$device_type" "$runtime")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          # A new simulator answered safaridriver only with a timeout waiting for
          # Safari's RWIApplication. These are the web inspector and Safari keys
          # that a working iOS 26.5 setup on this image writes (which of them
          # matter is not known); a restart lets webinspectord and Safari read them.
          for key in \
            com.apple.webinspectord:RemoteInspectorEnabled \
            com.apple.webinspectord:RemoteAutomationEnabled \
            com.apple.webinspectord:WIRRemoteAutomationEnabled \
            com.apple.mobilesafari:WebKitDeveloperExtrasEnabledPreferenceKey \
            com.apple.mobilesafari:WebInspectorEnabled \
            com.apple.mobilesafari:RemoteAutomationEnabled \
            com.apple.mobilesafari:WebKitRemoteAutomationEnabled; do
            xcrun simctl spawn "$device" defaults write "${key%%:*}" "${key#*:}" -bool true
          done
          xcrun simctl shutdown "$device"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          # Safari running first gives the web inspector an application to list.
          xcrun simctl launch "$device" com.apple.mobilesafari
      - name: 'Allow safaridriver to drive Safari'
        run: 'sudo safaridriver --enable'
      # One session and no test retries; only the session creation is retried,
      # relaunching Safari, when safaridriver cannot reach the simulator's Safari.
      - name: 'Run the probe page and the install and command checks in iOS Safari'
        env:
          FORMICARIUM_SAFARI_PLATFORM: 'ios'
        run: |-
          safaridriver --port 4444 &
          driver=$!
          trap 'kill "$driver"' EXIT
          node --test --test-concurrency=1 tests/browser/safari-probe.test.js
      # A later timeout then shows whether the remote-automation keys were set.
      - name: 'Record the simulator and its web inspector and Safari settings after a failure'
        if: 'failure()'
        run: |-
          xcrun simctl list devices booted
          for domain in com.apple.webinspectord com.apple.mobilesafari; do
            echo "--- $domain"
            xcrun simctl spawn booted defaults read "$domain" || true
          done
  product-tests:
    if: "always() && needs.changes.outputs.product == 'true'"
    needs:
      - 'changes'
      - 'product-build'
      - 'product-regression'
      - 'product-safari'
      - 'product-safari-ios'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      - name: 'Require every product build, native baseline, matrix suite and Safari'
        env:
          BUILD_RESULT: '${{ needs.product-build.result }}'
          REGRESSION_RESULT: '${{ needs.product-regression.result }}'
          SAFARI_RESULT: '${{ needs.product-safari.result }}'
          SAFARI_IOS_RESULT: '${{ needs.product-safari-ios.result }}'
        run: 'test "$BUILD_RESULT" = success && test "$REGRESSION_RESULT" = success && test "$SAFARI_RESULT" = success && test "$SAFARI_IOS_RESULT" = success'
      - name: 'Download products built by this source and run'
        uses: 'actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333' # v8.0.2
        with:
          pattern: 'product-build-*-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}'
          path: 'dist'
          merge-multiple: true
      - name: 'Restore guest executable permissions'
        run: 'chmod +x dist/guests/probe dist/guests/hello dist/guests/exit3 dist/guests/ttyecho dist/guests/aube dist/guests/pitchfork dist/guests/nano'
      - name: 'Retain complete compiled products for source-bound candidate inputs'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
        with:
          name: 'compiled-products-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}'
          path: 'dist/'
          retention-days: 7
          if-no-files-found: 'error'
  release-candidate:
    needs: [changes]
    if: needs.changes.outputs.candidate == 'true'
    uses: ./.github/workflows/release-candidate.yml
    with:
      source-sha: ${{ github.event.pull_request.head.sha || github.sha }}
  commit-format:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          fetch-depth: 0
          persist-credentials: false
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          ref: "${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}"
          path: '.trusted-base'
          persist-credentials: false
      - uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # v2.2.0
        with:
          bun-version: 'latest'
      - name: 'Load reviewed validator for the initial migration only'
        if: "${{ (github.event.pull_request.base.sha || github.event.before) == '12a92eabf70f6772f11e33f698e3db5088992270' }}"
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          ref: '7fc23afedef9a2296cb24026c0f19998a6933da7'
          path: '.trusted-bootstrap'
          persist-credentials: false
      - name: 'Validate with trusted base rules'
        env:
          BASE_SHA: "${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}"
          HEAD_SHA: '${{ github.event.pull_request.head.sha || github.sha }}'
          TRUSTED_VALIDATOR: "${{ (github.event.pull_request.base.sha || github.event.before) == '12a92eabf70f6772f11e33f698e3db5088992270' && '.trusted-bootstrap/scripts/ci/commit-format.ts' || '.trusted-base/scripts/ci/commit-format.ts' }}"
        run: 'bun "$TRUSTED_VALIDATOR" "$BASE_SHA" "$HEAD_SHA"'
  ci-required:
    if: 'always()'
    needs:
      - 'quality'
      - 'product-tests'
      - 'commit-format'
      - 'changes'
      - 'release-candidate'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
      - uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # v2.2.0
        with:
          bun-version: 'latest'
      - name: 'Record observed job outcomes'
        env:
          SOURCE_SHA: '${{ github.event.pull_request.head.sha || github.sha }}'
          OBSERVED_JOBS: '${{ toJSON(needs) }}'
        run: 'bun scripts/ci/ordinary-receipt.ts'
      - uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
        with:
          name: 'ordinary-ci-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}'
          path: '.artifacts/ordinary-ci/receipt.json'
          include-hidden-files: true
          if-no-files-found: 'error'
      - name: 'Require each needed job to pass and each unneeded job to be skipped'
        env:
          CHANGES_RESULT: '${{ needs.changes.result }}'
          QUALITY_NEEDED: '${{ needs.changes.outputs.quality }}'
          QUALITY_RESULT: '${{ needs.quality.result }}'
          PRODUCT_NEEDED: '${{ needs.changes.outputs.product }}'
          PRODUCT_RESULT: '${{ needs.product-tests.result }}'
          COMMIT_RESULT: '${{ needs.commit-format.result }}'
          CANDIDATE_REQUIRED: '${{ needs.changes.outputs.candidate }}'
          CANDIDATE_RESULT: '${{ needs.release-candidate.result }}'
        run: |
          gate() {
            if [ "$1" = true ]; then
              test "$2" = success
            else
              test "$1" = false
              test "$2" = skipped
            fi
          }
          test "$CHANGES_RESULT" = success
          test "$COMMIT_RESULT" = success
          gate "$QUALITY_NEEDED" "$QUALITY_RESULT"
          gate "$PRODUCT_NEEDED" "$PRODUCT_RESULT"
          gate "$CANDIDATE_REQUIRED" "$CANDIDATE_RESULT"
