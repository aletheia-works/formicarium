{
  # Daily: Dependabot's default cooldown already waits three days after a
  # release, so a weekly run left a new version out for up to ten days.
  'version': 2,
  'updates': [
      {
        'package-ecosystem': 'bun',
        'directory': '/',
        'schedule':
          { 'interval': 'daily', 'time': '05:00', 'timezone': 'Asia/Tokyo' },
        'labels': ['dependencies'],
        'commit-message': { 'prefix': 'chore(deps)' },
        'open-pull-requests-limit': 5,
      },
      {
        'package-ecosystem': 'bun',
        'directory': '/showcase/site',
        'schedule':
          { 'interval': 'daily', 'time': '05:00', 'timezone': 'Asia/Tokyo' },
        'labels': ['dependencies'],
        'commit-message': { 'prefix': 'chore(deps)' },
        'open-pull-requests-limit': 5,
      },
      # astro check runs in its own install because @astrojs/check accepts only
      # TypeScript 5 and 6; ignore TypeScript majors until its peer range moves.
      {
        'package-ecosystem': 'bun',
        'directory': '/showcase/site/tooling/astro-check',
        'schedule':
          { 'interval': 'daily', 'time': '05:00', 'timezone': 'Asia/Tokyo' },
        'labels': ['dependencies'],
        'commit-message': { 'prefix': 'chore(deps)' },
        'open-pull-requests-limit': 5,
        'ignore':
          [
            {
              'dependency-name': 'typescript',
              'update-types': ['version-update:semver-major'],
            },
          ],
      },
      {
        'package-ecosystem': 'github-actions',
        'directory': '/',
        'schedule':
          { 'interval': 'daily', 'time': '05:00', 'timezone': 'Asia/Tokyo' },
        'labels': ['dependencies'],
        'commit-message': { 'prefix': 'chore(deps)' },
        'open-pull-requests-limit': 5,
        'groups': { 'github-actions': { 'patterns': ['*'] } },
      },
    ],
}
