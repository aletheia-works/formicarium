{
  "version": 2,
  "updates": [
    {
      "package-ecosystem": "bun",
      "directory": "/",
      "schedule": {
        "interval": "weekly",
        "day": "monday",
        "time": "05:00",
        "timezone": "Asia/Tokyo"
      },
      "labels": [
        "dependencies"
      ],
      "commit-message": {
        "prefix": "chore(deps)"
      },
      "open-pull-requests-limit": 5
    },
    {
      "package-ecosystem": "github-actions",
      "directory": "/",
      "schedule": {
        "interval": "weekly",
        "day": "monday",
        "time": "05:00",
        "timezone": "Asia/Tokyo"
      },
      "labels": [
        "dependencies"
      ],
      "commit-message": {
        "prefix": "chore(deps)"
      },
      "open-pull-requests-limit": 5,
      "groups": {
        "github-actions": {
          "patterns": [
            "*"
          ]
        }
      }
    }
  ]
}
