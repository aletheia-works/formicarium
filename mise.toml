# formicarium の開発ツール。emsdk は mise ではなく ~/AppData/Local/emsdk
# （Windows 以外では ~/emsdk）を使う。scripts/emscripten-env.sh を参照。
[tools]
"github:awslabs/aidlc-workflows" = { version = "latest", matching_regex = "^aidlc-(darwin|linux|windows)-", bin = "aidlc", additional_asset_patterns = ["aidlc-runtime-{{ version }}.tar.gz"] }
node = "latest"
bun = "latest"
rust = { version = "stable", targets = "x86_64-unknown-linux-musl" }
cmake = "latest"
ninja = "latest"

[tasks.install-frozen]
run = "bun scripts/ci/tasks.ts install-frozen"

[tasks.build]
run = "bun scripts/ci/tasks.ts build"

[tasks.typecheck]
run = "bun scripts/ci/tasks.ts typecheck"

[tasks.check]
run = "bun scripts/ci/tasks.ts lint"

[tasks.test-light]
run = "bun scripts/ci/tasks.ts test-light"

[tasks.test-consumer]
run = "bun scripts/ci/tasks.ts test-consumer"

[tasks.verify-candidate]
run = "bun scripts/ci/tasks.ts verify-candidate"
