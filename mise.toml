# formicarium の開発ツール。emsdk は mise ではなく ~/AppData/Local/emsdk
# （Windows 以外では ~/emsdk）を使う。scripts/emscripten-env.sh を参照。
[tools]
actionlint = "latest"
shellcheck = "latest"
ripgrep = "latest"
node = "latest"
bun = "latest"
rust = { version = "stable", targets = "x86_64-unknown-linux-musl" }
cmake = "latest"
ninja = "latest"
opentofu = "latest"
